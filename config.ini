# spo2_alarm 参数配置
# 改完这个文件不用动代码，重新运行 start.sh（或 spo2_alarm.py）就会生效。
# 所有时间单位是秒，血氧单位是 %。

[detection]
# --- A. 反复下降：cluster_win 秒内出现 >= cluster_n 次下降事件就报警 ---
# 单次下降事件的定义：血氧低于「过去 base_win 秒内最高值」drop 个点以上，
# 并且这个状态持续至少 min_dur 秒。
drop = 4
min_dur = 10
base_win = 120
cluster_n = 5
cluster_win = 300

# --- B. 深度低值：连续 low_dur 秒低于 low_abs% 就报警 ---
low_abs = 85
low_dur = 10

# --- C. 持续低氧兜底：连续 sustain_dur 秒低于 sustain_abs% 就报警 ---
# 平时的周期性下降几十秒就回升，不会触发；只有掉下去回不来才触发。
# 这条不受冷却时间限制，每次持续低氧一定会报一次。
sustain_abs = 88
sustain_dur = 60

# --- 报警节流：报警后 cooldown 秒内不重复报警 ---
cooldown = 180

# --- 伪读数过滤 ---
# 出现以下情况之一时，接下来 settle 秒内的读数不参与判断：
#   1. 相邻两次读数相差超过 jump 个点（真实血氧变化没这么快）
#   2. 手指重新接触探头
#   3. 数据中断超过 gap 秒（比如蓝牙重连）
jump = 5
settle = 15
gap = 10

# --- 设备提醒（静默通知：不响不震，早上在通知中心能看到）---
finger_off = 120   # 手指脱落超过这么久提醒一次
link_lost = 180    # 蓝牙断连超过这么久提醒一次

[device]
# 电量不够"不连蓝牙撑到 morning"时：发一条静默通知，让设备停止推送并断开，然后退出程序，
# 把剩下的电留给设备自己记录（EMAY app 里仍能导出整晚数据），这之后不再报警。
#
# 需要的电量 = 100 / standalone_hours × 离 morning 的小时数 + reserve + 10（读数误差）
#   - 10 是因为设备按 10% 一档上报：报 90 时实际可能只有 81 左右，按最坏情况少算一档
#   - 离 morning 超过 12 小时（白天测试）时不算到早上，只要 reserve + 10
# 需要的电量最低不低于 min_battery。每次读到电量都按当时的时间重新计算，报告的电量 <= 需要的电量就停。
#
# standalone_hours：满电、不连蓝牙时设备能记录几小时
#   - 官方产品页：10 小时（continuous recording）；官方入门指南：12 小时（continuous working）
#   - 实测：连着蓝牙一整晚（约 7 小时）从 100% 掉到 50%，满电连蓝牙约能用 12–17 小时，所以 14 已经偏保守
morning = 07:00         # 需要撑到的时间
standalone_hours = 14   # 数字越小越保守
reserve = 10            # 安全余量（%）
min_battery = 20        # 底线：无论几点、上面算出多少，报告的电量 <= 这个值一定退出

[bark]
# critical 推送的音量，0-10。可以按需调大调小，不影响是否会穿透静音/专注模式。
volume = 1
# 持续低氧报警里提示拨打的急救电话。个人的值写在 config.local.ini（不提交），例如：
#   [bark]
#   emergency_number = <你所在地区的急救电话>
emergency_number = 当地急救电话
